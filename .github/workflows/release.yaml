name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v0.1.0'
        type: string
        required: true
      confirm_release:
        description: '我确认已完成本次版本发行所需的全部准备工作（包括但不限于版本号更新、CHANGELOG 更新、文档同步、代码审查及必要测试）。'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

jobs:
  confirm-release:
    name: Confirm Release
    runs-on: ubuntu-latest
    steps:
      - name: Check release confirmation
        if: ${{ inputs.confirm_release != true }}
        run: |
          echo "❌ 发行已取消：请先确认已完成所有发行前准备工作。"
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    needs: confirm-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS (Apple Silicon)
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS (Intel)
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            name: Linux (x86_64)
            rust-targets: ''
          - platform: windows-latest
            args: ''
            name: Windows (x86_64)
            rust-targets: ''

    uses: ./.github/workflows/_shared-build.yaml
    with:
      platform: ${{ matrix.platform }}
      args: ${{ matrix.args }}
      rust-targets: ${{ matrix.rust-targets }}
      name: ${{ matrix.name }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundles-*
          path: ./artifact
          merge-multiple: true
      - name: Debug - list files
        run: |
          tree .
      - name: Move artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          # 使用 rsync 将 artifact/ 下的内容合并到 release/
          # --remove-source-files 会在复制后删除已复制的普通文件（保留目录）
          rsync -a --remove-source-files artifact/ release/
          # 删除 artifact 中可能残留的空目录
          find artifact -type d -empty -delete || true
          tree ./release
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # 对所有文件递归生成 sha256，按路径排序以保证稳定输出
          # 输出格式: <hash>  ./path/to/file
          find . -type f -print0 | sort -z | xargs -0 sha256sum > sha256sums.txt
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! find release -type f -print -quit | grep -q .; then
            echo "No release files found; refusing to publish an empty checksum table." >&2
            exit 1
          fi

          {
            echo "# Win12 Desktop ${{ inputs.tag }}"
            echo
            echo "其他下载地址："
            echo
            echo "[![AUR win12-desktop-bin](https://img.shields.io/badge/AUR-win12--desktop--bin-49bdff?style=flat-square)](https://aur.archlinux.org/packages/win12-desktop-bin)  "
            echo "[![Mirror mirror.nju.edu.cn](https://img.shields.io/badge/Mirror-mirror.nju.edu.cn-61dafb?style=flat-square)](https://mirror.nju.edu.cn/github-release/win12-online/win12-desktop[...])"
            echo
            echo "[不知道该下载哪个文件?](https://win12-wiki.lingbopro.qzz.io/zh/desktop/installation)"
            echo
            echo "## 文件校验"
            echo
            echo "| File | Checksum (SHA256) |"
            echo "| --- | --- |"
            # 解析 sha256sums.txt 中的每一行，格式为 "<hash>  ./path"
            while IFS= read -r line; do
              # 取第一个空格前的 hash，取两个空格后的 filename（sha256sum 默认使用两个空格分隔）
              sum="${line%% *}"
              file="${line#*  }"
              # 去掉开头的 ./ 前缀
              file="${file#./}"
              printf "| `%s` | `%s` |\n" "$file" "$sum"
            done < sha256sums.txt
          } > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.BEDEVERE_WIN12_BOT_TOKEN }}
          tag_name: ${{ inputs.tag }}
          name: Win12-desktop ${{ inputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          files: |
            release/*
      - name: Trigger NJU mirror sync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.NJU_MIRROR_SSH_KEY }}" > ~/.ssh/nju_key
          chmod 600 ~/.ssh/nju_key
          ssh -i ~/.ssh/nju_key \
            -p 52222 \
            -o StrictHostKeyChecking=no \
            pushsync@mirror.nju.edu.cn \
            github-release