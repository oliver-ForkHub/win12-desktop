name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v0.1.0'
        type: string
        required: true
      confirm_release:
        description: '我确认已完成本次版本发行所需的全部准备工作（包括但不限于版本号更新、CHANGELOG 更新、文档同步、代码审查及必要测试）。'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

jobs:
  confirm-release:
    name: Confirm Release
    runs-on: ubuntu-latest
    steps:
      - name: Check release confirmation
        if: ${{ inputs.confirm_release != true }}
        run: |
          echo "❌ 发行已取消：请先确认已完成所有发行前准备工作。"
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    needs: confirm-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS (Apple Silicon)
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS (Intel)
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            name: Linux (x86_64)
            rust-targets: ''
          - platform: windows-latest
            args: ''
            name: Windows (x86_64)
            rust-targets: ''

    uses: ./.github/workflows/_shared-build.yaml
    with:
      platform: ${{ matrix.platform }}
      args: ${{ matrix.args }}
      rust-targets: ${{ matrix.rust-targets }}
      name: ${{ matrix.name }}

  build-flatpak:
    name: Build Flatpak
    needs: confirm-release
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: win12-desktop.flatpak
          manifest-path: io.github.win12_online.win12_desktop.yml
          artifact-name: flatpak-bundles
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Test Flatpak installation
        run: |
          flatpak --user install -y ./win12-desktop.flatpak
          flatpak info io.github.win12_online.win12_desktop
          flatpak run --command=sh io.github.win12_online.win12_desktop -c \
            'test -x /app/bin/win12-desktop && test -x /app/bin/ping && test -x /app/bin/ping6'

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundles
          path: win12-desktop.flatpak
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish Release
    needs: [build, build-flatpak]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*bundles*'
          path: ./artifact
          merge-multiple: true
      - name: Debug - list files
        run: |
          tree .
      - name: Move artifacts
        run: |
          mkdir release
          find ./artifact -type f -print0 | xargs -0 -i mv -v {} release/
          tree ./release
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum * > sha256sums.txt
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! find release -type f -print -quit | grep -q .; then
            echo "No release files found; refusing to publish an empty checksum table." >&2
            exit 1
          fi

          {
            echo "# Win12 Desktop ${{ inputs.tag }}"
            echo
            echo "其他下载地址："
            echo
            echo "[![AUR win12-desktop-bin](https://img.shields.io/badge/AUR-win12--desktop--bin-49bdff?style=flat-square)](https://aur.archlinux.org/packages/win12-desktop-bin)  "
            echo "[![Mirror mirror.nju.edu.cn](https://img.shields.io/badge/Mirror-mirror.nju.edu.cn-61dafb?style=flat-square)](https://mirror.nju.edu.cn/github-release/win12-online/win12-desktop/)"
            echo
            echo "[不知道该下载哪个文件?](https://win12-wiki.lingbopro.qzz.io/zh/desktop/installation)"
            echo
            echo "## 文件校验"
            echo
            echo "| File | Checksum (SHA256) |"
            echo "| --- | --- |"
            cat ./release/sha256sums.txt | awk '{printf "| `%s` | `%s` |\n", substr($0, 67), $1}'
          } > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.BEDEVERE_WIN12_BOT_TOKEN }}
          tag_name: ${{ inputs.tag }}
          name: Win12-desktop ${{ inputs.tag }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          files: |
            release/*
      - name: Trigger NJU mirror sync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.NJU_MIRROR_SSH_KEY }}" > ~/.ssh/nju_key
          chmod 600 ~/.ssh/nju_key
          ssh -i ~/.ssh/nju_key \
            -p 52222 \
            -o StrictHostKeyChecking=no \
            pushsync@mirror.nju.edu.cn \
            github-release
